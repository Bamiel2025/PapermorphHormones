<script>

const CHAPTER = {
  number: 3,
  title: 'Œstrogènes et progestérone : la synchronisation des cycles',
  minutes: 6,
  language: 'fr',
  next: '../ch04/',
};

const BEATS = [
  ['intro', 'Introduction', (m, D) => {
    const g = G(scene, { o: 0, y: 18 });
    T(g, 'SVT · Cycle 4 (4e) · Partie 2 · Chapitre 3', { x: 800, y: 195, size: 27, fill: COL.dim, anchor: 'middle' });
    T(g, 'Œstrogènes et progestérone', { x: 800, y: 300, size: 74, weight: 700, fill: COL.chalk, anchor: 'middle' });

    horArrow(g, 515, 545, 1075, 545, .35, { color: C_PROG, sw: 5 });
    horSchemaNode(g, 1230, 545, 260, 88, 'Cycle utérin', { color: C_PROG, sub: 'règles J1–J5' });
    T(g, 'Dosages hormonaux coordonnés', { x: 795, y: 505, size: 22, weight: 600, fill: C_PROG, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .12, .75, out);
    const sub = horText(scene, 'Comment ces deux hormones accordent-elles l’ovaire et l’utérus au cours du mois ?', 800, 745, m('sub'), { size: 29, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -18 }, D - .75, .65);
    hide(sub, D - .75, .65);
  }],

  ['roue_cycle', 'Calendrier d’un cycle moyen', (m) => {
    const p = panel(0);
    horTitle(p, 'Le calendrier d’un cycle moyen de 28 jours', 68, .05, 'Repères temporels issus de l’activité « Le cycle menstruel »');

    horCard(p, 75, 152, 460, 560, { title: 'Roue du cycle (28 jours)', color: C_PILULE, t0: .08 });
    horDoc(p, '../img/doc_roue_cycle.webp', 105, 218, 400, 445, { color: C_PILULE, pad: 14, t0: .14 });

    horCard(p, 580, 152, 945, 166, { title: 'J1 à J5 · Les règles (menstruations)', color: C_PILULE, t0: m('periods') });
    horText(p, 'Par convention, le 1er jour des règles marque le jour 1 du cycle.', 615, 242, m('periods') + .2, { size: 24 });
    horText(p, 'La couche superficielle de la muqueuse utérine se détache (environ 5 jours).', 615, 282, m('periods') + .35, { size: 22, fill: C_PILULE });

    horCard(p, 580, 348, 945, 166, { title: 'J14 · L’ovulation (cycle de 28 jours)', color: C_ESTRO, t0: m('ovulation') });
    horText(p, 'L’ovaire expulse un ovule prêt à être fécondé.', 615, 438, m('ovulation') + .2, { size: 24 });
    horText(p, 'Durée de vie d’un ovule : environ 24 à 48 heures dans les trompes.', 615, 478, m('ovulation') + .35, { size: 22, fill: C_ESTRO });

    horCard(p, 580, 544, 945, 168, { title: 'J11 à J16 · Période féconde', color: C_SEX, t0: m('fertile') });
    horText(p, 'Fenêtre où une fécondation est possible (spermatozoïdes : 3 à 5 jours).', 615, 634, m('fertile') + .2, { size: 24 });
    horText(p, 'Attention : ce repère J14 vaut uniquement pour un cycle de 28 jours.', 615, 674, m('fertile') + .35, { size: 22, fill: C_SEX });
  }],

  ['courbes_doc2', 'Document 2 · Courbes hormonales', (m) => {
    const p = panel(0);
    horTitle(p, 'Document 2 · Courbes hormonales et muqueuse utérine', 68, .05, 'Superposition des taux sanguins et de l’état de l’utérus sur 28 jours');

    horDoc(p, '../img/doc2_cycle_hormones.webp', 210, 138, 1180, 475, { color: C_ESTRO, pad: 10, t0: .06 });
    horSpotlight(p, 735, 155, 235, 390, C_ESTRO, m('estro'), .4);
    horSpotlight(p, 975, 155, 225, 390, C_PROG, m('prog'), .4);
    horSpotlight(p, 1205, 155, 115, 390, C_PILULE, m('drop'), .4);

    horCard(p, 95, 632, 445, 175, { title: '1. Avant J14 : Œstrogènes', color: C_ESTRO, t0: m('estro') });
    horText(p, 'Pic proche de 30 ng/mL avant J14.', 120, 718, m('estro') + .2, { size: 21, weight: 700, fill: C_ESTRO });
    horText(p, 'Déclenche l’ovulation et amorce', 120, 752, m('estro') + .35, { size: 20 });
    horText(p, 'la reconstruction de la muqueuse.', 120, 780, m('estro') + .4, { size: 20 });

    horCard(p, 578, 632, 445, 175, { title: '2. J14–J28 : Progestérone', color: C_PROG, t0: m('prog') });
    horText(p, 'Pic vers 250 pg/mL en 2e phase.', 603, 718, m('prog') + .2, { size: 21, weight: 700, fill: C_PROG });
    horText(p, 'Épaissit et enrichit la muqueuse', 603, 752, m('prog') + .35, { size: 20 });
    horText(p, 'en glandes et vaisseaux sanguins.', 603, 780, m('prog') + .4, { size: 20 });

    horCard(p, 1060, 632, 445, 175, { title: '3. Fin de cycle (J28) : Chute', color: C_PILULE, t0: m('drop') });
    horText(p, 'Chute brutale des 2 hormones.', 1085, 718, m('drop') + .2, { size: 21, weight: 700, fill: C_PILULE });
    horText(p, 'Sans embryon, la muqueuse', 1085, 752, m('drop') + .35, { size: 20 });
    horText(p, 'se détache → ce sont les règles.', 1085, 780, m('drop') + .4, { size: 20 });
  }],

  ['q1', 'Question · Déclenchement des règles', (m) => {
    const p = panel(0);
    horTitle(p, 'Rappel · Fin du cycle (28e jour)', 72, .05, 'Lecture de la fin des courbes du Document 2');
    horCard(p, 260, 175, 480, 220, { title: 'Œstrogènes et Progestérone', color: C_PILULE, t0: .1 });
    horText(p, 'Taux sanguins en chute rapide', 500, 295, .2, { size: 25, weight: 700, fill: C_PILULE, anchor: 'middle' });
    horText(p, '(absence de fécondation)', 500, 336, .25, { size: 21, fill: COL.dim, anchor: 'middle' });
    horArrow(p, 760, 285, 895, 285, .3, { color: C_PILULE, sw: 5 });
    horCard(p, 915, 175, 425, 220, { title: 'Muqueuse utérine', color: C_ESTRO, t0: .2 });
    horText(p, 'Effet observé à J28–J1 ?', 1127, 305, .35, { size: 24, weight: 700, fill: C_ESTRO, anchor: 'middle' });
  }, {
    ask: done => quiz(BAND, [{
      id: 'ch3-q1',
      prompt: ['D’après le Document 2, qu’est-ce qui déclenche directement l’apparition des règles en fin de cycle ?'],
      build: choice([
        'La chute brutale des taux d’œstrogènes et de progestérone',
        'Un nouveau pic maximal de progestérone à J28',
        'L’augmentation du volume des testicules',
      ], 0, 'Exact ! Sans nidation, les taux hormonaux chutent et la muqueuse se détache : ce sont les règles.', [
        null,
        'Non, c’est justement quand la progestérone et les œstrogènes chutent que la muqueuse n’est plus maintenue.',
        'Non, il s’agit ici du cycle féminin contrôlé par les ovaires.',
      ]),
    }], done),
  }],

  ['variabilite', 'Muqueuse utérine et variabilité', (m) => {
    const p = panel(0);
    horTitle(p, 'Évolution de la muqueuse et variabilité des cycles', 68, .05, 'De l’épaisseur (2–3 mm) à la vigilance sur les dates');

    horCard(p, 65, 148, 795, 410, { title: 'Coupes schématiques de la paroi utérine', color: C_SEX, t0: .08 });
    const stages = [
      ['J1–J5 Règles', 'menstruation', C_PILULE, .2],
      ['J6–J13 Croissance', 'grow', C_ESTRO, m('lining')],
      ['J14–J27 Nidation', 'thick', C_PROG, m('lining') + .45],
      ['J28 Détachement', 'thin', C_BRAIN, m('lining') + .85],
    ];
    stages.forEach(([lbl, st, col, t0], i) => {
      const x = 92 + i * 190;
      horMucosaStage(p, x, 225, 165, 215, { stage: st, t0, label: lbl, color: col });
    });
    horText(p, 'De 2–3 mm, la muqueuse s’épaissit avec vaisseaux et glandes en tube.', 462, 526, m('lining') + .6, { size: 20, fill: COL.dim, anchor: 'middle' });

    horCard(p, 885, 148, 650, 410, { title: 'Zoom courbes · Document 2', color: C_BLOOD, t0: .12 });
    horDoc(p, '../img/doc2_courbe_seule.webp', 908, 212, 604, 326, { color: C_BLOOD, pad: 8, t0: .18 });

    horCard(p, 65, 588, 1470, 212, { title: 'Mise en garde importante du document (encadré rouge)', color: C_PILULE, t0: m('caution') });
    horText(p, 'La durée d’un cycle varie d’une femme à l’autre (ex. 23 à 35 jours) et d’un mois à l’autre chez une même femme.', 800, 686, m('caution') + .25, { size: 23, weight: 700, fill: COL.chalk, anchor: 'middle' });
    horText(p, 'Conséquence : la date de l’ovulation n’est pas fixe le 14e jour ; la phase avant l’ovulation varie fortement.', 800, 738, m('caution') + .5, { size: 22, fill: C_ESTRO, anchor: 'middle' });
  }],

  ['q2', 'Question · Pic pré-ovulatoire', (m) => {
    const p = panel(0);
    horTitle(p, 'Rappel · Lecture du Document 2 avant J14', 72, .05);
    horDoc(p, '../img/doc2_courbe_seule.webp', 360, 140, 880, 355, { color: C_ESTRO, pad: 8, t0: .08 });
    horSpotlight(p, 640, 155, 130, 275, C_ESTRO, .25, .4);
  }, {
    ask: done => quiz(BAND, [{
      id: 'ch3-q2',
      prompt: ['Sur le Document 2, quelle hormone atteint son pic juste avant l’ovulation (autour du 14e jour) ?'],
      build: choice([
        'Les œstrogènes (pic vers 30 ng/mL)',
        'La progestérone (pic uniquement pendant les règles)',
        'Aucune hormone ne varie avant J14',
      ], 0, 'Exact ! Le pic d’œstrogènes juste avant J14 précède l’ovulation, tandis que la progestérone domine ensuite.', [
        null,
        'Non, le grand pic de progestérone se produit après l’ovulation, entre J14 et J28.',
        'Non, regarde la courbe des œstrogènes juste avant la flèche « Ovulation ».',
      ]),
    }], done),
  }],

  ['wrap', 'À retenir · Chapitre 3', (m) => {
    const p = panel(0);
    horTitle(p, 'À retenir — Chapitre 3', 72, .05, 'Synchronisation hormonale et variabilité des cycles');

    const rows = [
      ['1. Cycle moyen de 28 jours', 'Règles à partir du jour 1 (~5 jours), ovulation autour de J14 et période féconde vers J11–J16.', C_BLOOD, m('w1')],
      ['2. Œstrogènes puis Progestérone', 'Le pic d’œstrogènes précède l’ovulation ; la progestérone prépare et vascularise la muqueuse après J14.', C_PROG, m('w2')],
      ['3. Chute hormonale et variabilité', 'La chute des deux hormones provoque les règles ; la durée réelle varie selon les femmes et les cycles.', C_PILULE, m('w3')],
    ];
    rows.forEach(([ttl, desc, col, t0], i) => {
      const y = 162 + i * 208;
      horCard(p, 130, y, 1340, 174, { title: ttl, color: col, t0 });
      horText(p, desc, 800, y + 114, t0 + .2, { size: 23, fill: COL.chalk, anchor: 'middle' });
    });
  }],

  ['final1', 'Mise en pratique finale', () => {
    panel(0);
  }, {
    ask: done => quiz(SCREEN, [
      {
        id: 'ch3-f1',
        prompt: ['1 / 3 · Quel rôle joue la progestérone après l’ovulation (entre J14 et J28) ?'],
        build: choice([
          'Elle maintient la muqueuse utérine épaissie, riche en vaisseaux et en glandes',
          'Elle provoque immédiatement le détachement de la muqueuse (règles)',
          'Elle empêche le sang de circuler vers l’utérus',
        ], 0, 'Exact ! La progestérone prépare activement l’utérus à l’éventuelle nidation d’un embryon.', [
          null,
          'Non, les règles sont déclenchées par la chute de la progestérone et des œstrogènes à la fin du cycle.',
          'Non, au contraire la progestérone favorise la vascularisation de la muqueuse.',
        ]),
      },
      {
        id: 'ch3-f2',
        prompt: ['2 / 3 · Vrai ou Faux : coche la réponse correcte pour chaque énoncé.'],
        build: grid([
          { parts: ['Par convention, le jour 1 du cycle correspond au premier jour des règles.'], ans: ['v'], why: 'Vrai : c’est le repère de départ de chaque cycle menstruel.' },
          { parts: ['Sur le Document 2, le grand pic de progestérone a lieu avant l’ovulation.'], ans: ['f'], why: 'Faux : avant J14 domine le pic d’œstrogènes ; la progestérone grimpe après l’ovulation.' },
          { parts: ['La durée d’un cycle varie d’une femme à l’autre et d’un cycle à l’autre.'], ans: ['v'], why: 'Vrai : 28 jours n’est qu’une moyenne statistique.' },
        ], [['v', 'Vrai', C_SEX], ['f', 'Faux', C_PILULE]], { multi: false, text: true }),
      },
      {
        id: 'ch3-f3',
        prompt: ['3 / 3 · Complète les deux repères numériques d’un cycle théorique moyen :'],
        build: blanks([
          {
            parts: ['Pour un cycle moyen de ', { box: '28' }, ' jours, l’ovulation se situe vers le ', { box: '14' }, 'e jour.'],
            why: 'Parfait ! Un cycle théorique de 28 jours place l’ovulation au 14e jour.',
            hint: 'Durée classique du cycle moyen (en jours), puis moitié de cette durée.',
          },
        ]),
      },
    ], done, 'Mise en pratique · Chapitre 3'),
  }],

  ['finish', 'Terminé', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
